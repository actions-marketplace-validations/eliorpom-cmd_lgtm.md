# Builds and runs the unit tests, then draws every widget from the sample data.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --locked
      - run: cargo run --release --locked -- examples/data.json --out out
