# Builds one binary per platform when a version tag is pushed, and attaches them to the
# GitHub release. The action downloads the binary matching its tag (see action.yml).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/lgtm-md${{ matrix.exe }} lgtm-md-${{ matrix.target }}${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: lgtm-md-${{ matrix.target }}
          path: lgtm-md-${{ matrix.target }}${{ matrix.exe }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A tag with a dash (v1.0.0-rc.1) is published as a pre-release.
        run: |
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "$TAG" --generate-notes $pre
