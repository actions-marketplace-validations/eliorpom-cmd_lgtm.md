# Finds the public GitHub profiles that run LGTM.md and updates site/wild.json,
# the list behind the "Used by" row of lgtm.byelior.dev. Opt-out list: site/used-by-optout.json.
name: Used by

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit site/wild.json
  actions: write    # start the Pages workflow: a push made with GITHUB_TOKEN does not trigger it

concurrency: used-by

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Code search needs a token; an optional USED_BY_TOKEN secret (a classic token with no
      # scope) can replace the workflow token if GitHub ever limits it.
      - name: Search for profiles
        env:
          GITHUB_TOKEN: ${{ secrets.USED_BY_TOKEN || github.token }}
        run: node scripts/used-by.mjs
      - name: Commit and redeploy if the list changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add site/wild.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "site: update the Used by list"
          git push --quiet
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
