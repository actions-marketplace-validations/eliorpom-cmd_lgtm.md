# Publishes the launch page (site/) to GitHub Pages at lgtm.byelior.dev.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, examples/preview/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Copies the page, the preview GIFs and the font into one folder.
      - run: site/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
