# Copy to .github/workflows/lgtm-md.yml in your profile repository (<login>/<login>).
# Draws the widgets every night and commits them to the widgets/ folder.
name: LGTM.md

on:
  schedule:
    # Just after midnight UTC, so the widgets show the day that just ended.
    - cron: "30 0 * * *"
  workflow_dispatch:
  # Also runs as soon as this file is committed, so the widgets appear right away.
  push:
    paths: [.github/workflows/lgtm-md.yml]

permissions:
  contents: write

concurrency: lgtm-md

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin a release tag: a moving tag runs whatever code it points to on your account.
      - uses: eliorpom-cmd/lgtm.md@v1.2.0
        with:
          # Optional: a token with read access to your repositories counts private activity.
          token: ${{ secrets.LGTM_MD_TOKEN || github.token }}
          widgets: |
            flame
            grass
            duel-torvalds
          output-dir: widgets
      - name: Commit the widgets if they changed
        shell: bash
        run: |
          git add widgets
          if git diff --cached --quiet; then
            echo "The widgets are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "widgets: draw the day's widgets"
          git push --quiet
