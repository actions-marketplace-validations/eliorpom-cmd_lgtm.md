# Copy to .github/workflows/lgtm-md.yml in your project repository.
# Draws the project's widgets every night and publishes them on a separate `lgtm-md` branch,
# so the nightly commit never lands on the default branch, where it would count as activity.
name: LGTM.md

on:
  schedule:
    # Just after midnight UTC, so the widgets show the day that just ended.
    - cron: "30 0 * * *"
  workflow_dispatch:
  # Also runs as soon as this file is committed, so the widgets appear right away.
  push:
    paths: [.github/workflows/lgtm-md.yml]

permissions:
  contents: write
  # Lets the default token see the pull requests of a private repository.
  pull-requests: read

concurrency: lgtm-md

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      # Pin a release tag: a moving tag runs whatever code it points to on your account.
      - uses: eliorpom-cmd/lgtm.md@v1.2.0
        with:
          repo: ${{ github.repository }}
          widgets: |
            grass
            departures
            records
          output-dir: lgtm-md
      - name: Publish the widgets on the lgtm-md branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd lgtm-md
          git init --quiet --initial-branch lgtm-md
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Draw the widgets"
          # One commit, replaced every night: the branch never grows.
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lgtm-md
