[package]
name = "lgtm-md"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Animated pixel-art widgets for GitHub profile READMEs, drawn from your real activity."
repository = "https://github.com/eliorpom-cmd/lgtm.md"

[dependencies]
ab_glyph = "0.2.32"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indexmap = { version = "2.14.2", features = ["serde"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.1"
ureq = { version = "3.5.1", features = ["json", "platform-verifier"] }
